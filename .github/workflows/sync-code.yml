# Sync flow (each run): clone latest homeassistant/core Verisure component,
# skip cleanly if master lacks required session/vsure changes, otherwise
# regenerate homeassistant path layout from tracked patches/, git apply all
# patches, copy into custom_components/verisure, then bump HACS/manifest version.
# Upstream owns unpatched lines; commits custom_components/ and
# upstream_snapshot/ (unpatched baseline for change detection).
# Manifest versions use stable HA release numbers (no beta suffix); GitHub
# releases are created only for release-ready manifest versions.
name: "Sync Verisure Component Code"
on:
  workflow_dispatch:
  schedule:
    # Run every hour on weekdays
    - cron: "0 * * * 1-5"

jobs:
  sync-verisure-component-code:
    name: Sync Verisure Component Code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        name: Checkout repository

      - name: Update Verisure Component Code
        id: update
        run: |
          ./scripts/update.sh
          if [ "${VERISURE_SYNC_SKIPPED:-false}" = "true" ]; then
            echo "sync_skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "sync_skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit new changes
        if: steps.update.outputs.sync_skipped != 'true'
        id: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add custom_components/verisure upstream_snapshot hacs.json
          if ! git diff --staged --quiet; then
            if [ "${VERISURE_UPDATE_MODE:-full}" = "version_only" ]; then
              git commit -nm "Normalize component version metadata"
            else
              git commit -nm "Update Verisure component code"
            fi
            git push origin main
            echo "changes_made=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to the verisure component code on this run."
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure version tag and release
        if: steps.update.outputs.sync_skipped != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck source=scripts/version.sh
          source scripts/version.sh

          VERSION=$(jq -r .version custom_components/verisure/manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "No manifest version; skipping tag and release."
            exit 0
          fi

          if ! is_release_ready_version "$VERSION"; then
            echo "Manifest version $VERSION is prerelease; skipping tag and release."
            exit 0
          fi

          CHANGES="${{ steps.commit.outputs.changes_made }}"

          if gh release view "$VERSION" &>/dev/null; then
            if [ "$CHANGES" = "true" ]; then
              gh release delete "$VERSION" --yes
            else
              echo "Release $VERSION already exists; skipping."
              exit 0
            fi
          fi

          git tag -f "$VERSION"
          git push -f origin "refs/tags/$VERSION"
          gh release create "$VERSION" --latest --generate-notes --title "$VERSION"
